name: 部署网页端到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 允许读写 Pages 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同分支并发推送时只跑最新一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传网页端产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './webapp'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
