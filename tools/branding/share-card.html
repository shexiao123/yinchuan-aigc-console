<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; }
  body {
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:#F7F1E7; color:#241A12; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .frame {
    position:absolute; inset:34px; border:1px solid rgba(122,74,40,.18);
  }
  .glow {
    position:absolute; left:-120px; bottom:-180px; width:640px; height:640px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(198,146,88,.16), transparent 66%);
  }
  .inner { position:absolute; inset:34px; padding:72px 76px 62px; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .eyebrow { font-size:17px; letter-spacing:.3em; color:#9A6A38; font-weight:600; display:flex; align-items:center; gap:20px; }
  .eyebrow .line { width:60px; height:1px; background:#B5793D; }
  .seal {
    width:86px; height:86px; border:1.5px solid #B5793D; border-radius:50%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#A85A2D; font-size:20px; letter-spacing:.1em; line-height:1.32;
    font-weight:700; transform:rotate(-8deg);
  }
  h1 { margin-top:64px; font-size:82px; line-height:1.26; font-weight:700; letter-spacing:.01em; }
  h1 em { font-style:normal; color:#A85A2D; }
  .rule { width:88px; height:3px; background:#B5793D; margin:36px 0 26px; }
  .slogan { font-size:30px; letter-spacing:.18em; color:#5C4632; }
  .photo {
    margin-top:52px; width:100%; height:420px; border-radius:20px; overflow:hidden;
    position:relative; box-shadow:0 28px 60px -34px rgba(58,34,18,.75);
    background:#3A2418;
  }
  .photo img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(1.06) contrast(1.04); }
  .photo::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(32,18,10,.70), transparent 52%);
  }
  .photo-cap { position:absolute; z-index:2; left:38px; bottom:30px; color:#FFF8EC; }
  .photo-cap .en { font-size:14px; letter-spacing:.32em; opacity:.85; }
  .photo-cap .cn { font-size:26px; letter-spacing:.16em; margin-top:14px; font-weight:600; }
  .bottom { margin-top:auto; padding-top:30px; }
  .tags { display:flex; gap:14px; margin-bottom:26px; }
  .tag {
    font-size:17px; letter-spacing:.08em; color:#7A5A3E;
    border:1px solid rgba(122,74,40,.3); border-radius:99px;
    padding:9px 22px; background:rgba(255,255,255,.46);
  }
  .foot { display:flex; align-items:baseline; gap:22px; font-size:18px; color:#8A7259; letter-spacing:.06em; }
  .foot b { color:#3A2A1C; font-weight:700; font-size:20px; letter-spacing:.1em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="top">
      <div class="eyebrow">NINGXIA YUNNIAN <span class="line"></span> 2026</div>
      <div class="seal">银川<br>光影</div>
    </div>
    <h1>银川 <em>AIGC</em><br>数字文化产业基地</h1>
    <div class="rule"></div>
    <div class="slogan">让每一次心动都有画面</div>
    <div class="photo">
      <img src="file:///D:/WorkBuddy/2026-10-21-10-58-00/webapp/assets/covers/cover-03.jpg" alt="">
      <div class="photo-cap">
        <div class="en">AIGC DIGITAL CULTURE INDUSTRY BASE</div>
        <div class="cn">光影 · 影像 · 内容生产</div>
      </div>
    </div>
    <div class="bottom">
      <div class="tags">
        <span class="tag">婚礼微电影</span>
        <span class="tag">品牌宣传片</span>
        <span class="tag">短视频剪辑</span>
      </div>
      <div class="foot"><b>宁夏云辇文化科技有限公司</b><span>影视制作接单撮合平台 · 网页端 / 微信小程序 双端运行</span></div>
    </div>
  </div>
</body>
</html>
